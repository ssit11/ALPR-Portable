[build-system]
requires = ["briefcase"]

[project]
name = "plate-watcher"
version = "1.0.0"
description = "Fast license plate scanner with real-time detection and photo logging"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.briefcase]
project_name = "Plate Watcher"
bundle = "com.platewatcher"
version = "1.0.0"
url = "https://example.com/platewatcher"
author = "Developer"
author_email = "dev@example.com"

[tool.briefcase.app.my_app]
formal_name = "Plate Watcher"
description = "Fast license plate scanner with real-time detection and photo logging"
icon = "src/my_app/resources/my_app"
sources = ["src/my_app"]
license = { text = "MIT" }

requires = [
    "toga-cocoa",
    "opencv-python-headless",
    "pillow",
    "numpy",
    "pytesseract",
]

[tool.briefcase.app.my_app.iOS]
supported_target_model_frameworks = ["iOS"]

[tool.briefcase.app.my_app.iOS.info]
NSCameraUsageDescription = "Camera access is required for high-speed real-time license plate detection."
NSPhotoLibraryAddUsageDescription = "Permission is required to save license plate detection snapshots to your Photos."
NSPhotoLibraryUsageDescription = "Permission is required to output detection snapshots into your photo gallery."
NSLocationWhenInUseUsageDescription = "Location data is needed to burn precise GPS coordinates onto saved detection photos."
NSLocationAlwaysAndWhenInUseUsageDescription = "Location data is needed to tag detection snapshots."