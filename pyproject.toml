[build-system]
requires = ["briefcase"]

[project]
name = "my_app"
version = "1.0.0"
description = "Fast real-time mobile license plate scanner and logger"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[tool.briefcase]
project_name = "ALPR-Portable"
bundle = "com.alprportable"
version = "1.0.0"
url = "https://example.com/alprportable"
author = "Developer"
author_email = "dev@example.com"

[tool.briefcase.app.my_app]
formal_name = "ALPR-Portable"
description = "Fast real-time mobile license plate scanner and logger"
icon = "src/my_app/resources/icon"
sources = ["src/my_app"]
license = "MIT"
license-files = ["LICENSE"]

requires = [
    "toga-cocoa",
    "pillow",
]

[tool.briefcase.app.my_app.iOS]
supported_target_model_frameworks = ["iOS"]

[tool.briefcase.app.my_app.iOS.info]
NSCameraUsageDescription = "Camera access is required for real-time license plate detection."
NSPhotoLibraryAddUsageDescription = "Permission is required to save detection snapshots to Photos."
NSPhotoLibraryUsageDescription = "Permission is required to save detection snapshots to Photos."
NSLocationWhenInUseUsageDescription = "Location data is required to tag detection snapshots."
NSLocationAlwaysAndWhenInUseUsageDescription = "Location data is required to tag detection snapshots."