name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies & Briefcase
      run: |
        python -m pip install --upgrade pip
        pip install briefcase toga

    - name: Create iOS Xcode Project
      run: briefcase create iOS

    - name: Build iOS App
      run: briefcase build iOS --adhoc

    - name: Package Unsigned IPA
      run: |
        APP_PATH=$(find build/*/ios/xcode/build/Release-iphoneos -name "*.app" | head -n 1)
        
        if [ -z "$APP_PATH" ]; then
          echo "Error: Could not find compiled .app file!"
          exit 1
        fi

        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        zip -r PlateWatcher-unsigned.ipa Payload/

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PlateWatcher-Unsigned-IPA
        path: PlateWatcher-unsigned.ipa
